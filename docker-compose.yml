services:
  rabbit1:
    image: rabbitmq:3-management
    container_name: rabbit1
    hostname: rabbit1
    environment:
      - RABBITMQ_ERLANG_COOKIE=COOKIE_SECRETA_CLUSTERING
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - rabbit-net

  rabbit2:
    image: rabbitmq:3-management
    container_name: rabbit2
    hostname: rabbit2
    environment:
      - RABBITMQ_ERLANG_COOKIE=COOKIE_SECRETA_CLUSTERING
    ports:
      - "5673:5672"
      - "15673:15672"
    depends_on:
      - rabbit1
    networks:
      - rabbit-net

networks:
  rabbit-net:
    driver: bridge